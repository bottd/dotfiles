name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    # Host-mode runner on the VPS: Nix and its store are already there, so no
    # installer or cache action. Only x86_64-linux builds happen here; other
    # platforms are evaluated, not built.
    runs-on: nix
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Not `nix flake check`: it evaluates every host in one ~6G process.
      - name: Flake checks
        run: nix build --no-link --no-update-lock-file -L .#ciChecks

      - name: Evaluate every host
        run: |
          set -o pipefail
          nix eval --no-update-lock-file --raw .#ci.drvPaths \
            --apply 'p: builtins.concatStringsSep "\n" (builtins.attrNames p)' |
            while read -r variant; do
              echo "::group::$variant"
              nix eval --no-update-lock-file --raw ".#ci.drvPaths.$variant"
              echo; echo "::endgroup::"
            done
