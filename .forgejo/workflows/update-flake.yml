name: Update Flake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-flake:
    runs-on: nixos-x86_64
    timeout-minutes: 30
    steps:
      # Checkout keeps Forgejo's per-job token in the git config; it can push to
      # this repository, so `git push` below needs no stored secret.
      - uses: actions/checkout@v4

      - name: Update flake.lock
        id: update
        run: |
          nix flake update
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Same gate as check.yml; only a lock that passes it lands on main.
      - name: Check updated flake
        if: steps.update.outputs.changed == 'true'
        run: |
          nix build --no-link --no-update-lock-file -L .#ciChecks
          set -o pipefail
          nix eval --no-update-lock-file --raw .#ci.drvPaths \
            --apply 'p: builtins.concatStringsSep "\n" (builtins.attrNames p)' |
            while read -r variant; do
              echo "::group::$variant"
              nix eval --no-update-lock-file --raw ".#ci.drvPaths.$variant"
              echo; echo "::endgroup::"
            done

      - name: Push to main
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@noreply.loge"
          git commit -m "chore: update flake.lock" flake.lock
          git push origin HEAD:main
